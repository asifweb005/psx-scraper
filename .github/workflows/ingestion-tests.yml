name: Ingestion regression tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test quote_validation.test.js scraper.test.js history_validation.test.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest test_export_history.py
