name: PSX End of Day Sync

on:
  schedule:
    # Runs once daily at 5:45 PM PKT (12:45 UTC, Mon-Fri)
    - cron: '45 12 * * 1-5'
  workflow_dispatch:

concurrency:
  group: psx-eod-sync
  cancel-in-progress: false

jobs:
  eod-tasks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Validate ingestion behavior
        run: node --test quote_validation.test.js scraper.test.js

      - name: Run PSX EOD Scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scraper.js eod
