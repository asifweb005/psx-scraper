name: PSX Fundamentals Sync

on:
  schedule:
    # Runs once daily at 7:30 PM PKT (14:30 UTC, Mon-Fri)
    - cron: '30 14 * * 1-5'
  workflow_dispatch:

jobs:
  sync-fundamentals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Run PSX Fundamentals Scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: deno run --allow-net --allow-env fundamentals.ts
