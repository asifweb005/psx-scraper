name: PSX Live Quotes Sync

on:
  schedule:
    # Runs every 5 mins from 9:00 AM to 3:59 PM PKT (4:00 - 10:59 UTC, Mon-Fri)
    - cron: '*/5 4-10 * * 1-5'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

- name: Run PSX Quotes Scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: deno run --allow-net --allow-env scraper.ts quotes
